services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-lufai_admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-lufai}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-lufai_admin} -d ${DB_NAME:-lufai}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "0.50"
    networks:
      - internal_net
    # PORT 5432 IS NOT EXPOSED! Only visible to the 'api' service.

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PORT: "3000"
      DATABASE_URL: postgresql://${DB_USER:-lufai_admin}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-lufai}?sslmode=disable
      JWT_SECRET: ${JWT_SECRET}
      JWT_ISSUER: ${JWT_ISSUER:-lufai_api}
      JWT_ACCESS_TOKEN_TTL_SECS: ${JWT_ACCESS_TOKEN_TTL_SECS:-86400}
      RUST_LOG: ${RUST_LOG:-info}
      PAYSTACK_SECRET_KEY: ${PAYSTACK_SECRET_KEY:-}
      PAYSTACK_CALLBACK_URL: ${PAYSTACK_CALLBACK_URL:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    ports:
      - "127.0.0.1:3000:3000" # Only accessible via Nginx on the host
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"
    networks:
      - internal_net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  internal_net:
    driver: bridge

volumes:
  postgres_data:
