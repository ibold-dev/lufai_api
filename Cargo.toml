[package]
name = "lufai_api"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8", features = ["macros", "json"] }
tokio = { version = "1.37", features = ["rt-multi-thread", "macros", "signal"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tower-http = { version = "0.5", features = ["trace", "set-header", "cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.11", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres"] }
argon2 = "0.5"
rand_core = "0.6"
jsonwebtoken = "9.3"
casbin = "2.0"
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
sha2 = "0.10"
hex = "0.4"
hmac = "0.12"
utoipa = { version = "5", features = ["axum_extras", "uuid", "chrono"] }
utoipa-swagger-ui = { version = "9", features = ["axum"] }
paystack-rs = "1.6.0"
sea-orm = { version = "1.1.20", features = [
    "sqlx-postgres",
    "runtime-tokio-rustls",
    "macros",
    "uuid",
] }
sea-orm-migration = { version = "1.1.20", features = ["sqlx-postgres", "runtime-tokio-rustls"] }
validator = { version = "0.20.0", features = ["derive"] }
tower_governor = "0.8.0"
governor = "0.10.4"
rsa = { version = "0.9.10", features = ["pem"] }
base64 = { version = "0.22.1", features = ["alloc"] }
